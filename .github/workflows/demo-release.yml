name: Demo Release

# Push to master (or a manual run) rebuilds the demo APK and republishes it to
# the single `demo` GitHub Release. The release is never recreated: the latest
# run overwrites the asset in place, so the tag, the release page and the
# download URL stay stable.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep this pinned to the SDK version used locally; bump both
          # together so build behaviour does not drift between machines.
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: knowledge_reader
        run: flutter pub get

      - name: Analyze
        working-directory: knowledge_reader
        run: flutter analyze

      - name: Run tests
        # test/live_server_test.dart skips itself when no server is reachable,
        # so this stays green in CI.
        working-directory: knowledge_reader
        run: flutter test

      - name: Configure demo signing
        working-directory: knowledge_reader/android
        env:
          DEMO_KEYSTORE_BASE64: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.DEMO_KEYSTORE_PASSWORD }}
          DEMO_KEY_ALIAS: ${{ secrets.DEMO_KEY_ALIAS }}
          DEMO_KEY_PASSWORD: ${{ secrets.DEMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DEMO_KEYSTORE_BASE64}" ] || [ -z "${DEMO_KEYSTORE_PASSWORD}" ] \
             || [ -z "${DEMO_KEY_ALIAS}" ] || [ -z "${DEMO_KEY_PASSWORD}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              # Fork pull requests never receive secrets; build with the debug
              # fallback instead of failing, and do not publish anyway.
              echo "::warning title=Demo signing skipped::Pull request builds run without the demo keystore and fall back to debug signing."
              exit 0
            fi
            echo "::error title=Missing demo signing secrets::Add DEMO_KEYSTORE_BASE64, DEMO_KEYSTORE_PASSWORD, DEMO_KEY_ALIAS and DEMO_KEY_PASSWORD to the repository Actions secrets. Without a stable signature each build gets a different key, so users cannot update in place and lose their saved server settings."
            exit 1
          fi
          printf '%s' "${DEMO_KEYSTORE_BASE64}" | base64 --decode > app/demo-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=demo-keystore.jks\n' \
            "${DEMO_KEYSTORE_PASSWORD}" "${DEMO_KEY_PASSWORD}" "${DEMO_KEY_ALIAS}" > key.properties
          ls -la app/demo-keystore.jks key.properties

      - name: Build universal release APK
        # No --dart-define here: the demo build ships unconfigured and asks the
        # reader for the server address once.
        working-directory: knowledge_reader
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="knowledge_reader/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f knowledge_reader/android/key.properties ]; then
            echo "::warning title=Signature check skipped::No demo keystore was configured (pull request build); APK is debug signed."
            exit 0
          fi
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)"
          certs="$("$apksigner" verify --print-certs "$apk" | head -3)"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error title=Debug signature::The APK was signed with the debug key. Check that the signing secrets decoded correctly."
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp knowledge_reader/build/app/outputs/flutter-apk/app-release.apk \
             artifact/knowledge-reader-demo.apk
          ls -la artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk-${{ github.run_number }}
          path: artifact/
          retention-days: 3

  release:
    name: Update demo GitHub Release
    needs:
      - build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      # Serialise releases instead of cancelling: two overlapping pushes must
      # not race while replacing the same asset.
      group: knowledge-reader-demo-release
      cancel-in-progress: false
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk="$(find artifacts -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" release-assets/knowledge-reader-demo.apk
          ls -la release-assets

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          自动构建的 Knowledge Reader Demo 安装包（通用 release APK）。

          - 构建提交：${GITHUB_SHA}
          - 构建时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)
          - 服务地址：安装后首次打开时填写，之后会保存在本机，无需重复设置。
          EOF
          cat release-notes.md

      # A fixed tag maps to exactly one release, so this can only ever update
      # the single demo release; `--clobber` replaces the previous APK asset
      # instead of skipping it. Implemented with the preinstalled gh CLI rather
      # than a third-party action: softprops/action-gh-release@v2 aborts on
      # branch pushes with "Unexpected error fetching GitHub release for tag
      # refs/heads/master" once the release already exists.
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk=release-assets/knowledge-reader-demo.apk
          if gh release view demo --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload demo "$apk" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit demo \
              --title "Demo Build" \
              --prerelease \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create demo "$apk" \
              --title "Demo Build" \
              --prerelease \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          fi
          gh release view demo --repo "${GITHUB_REPOSITORY}" --json tagName,name,isPrerelease,assets
